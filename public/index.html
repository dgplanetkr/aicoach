function onboard(){
 const p=state.profile;const labels=['대표님 소개','내 사업과 고객','현재 창업 단계','가장 큰 고민','실행 가능한 시간'];
 let content='';
 if(state.step===0)content=`<h1>대표님, 반갑습니다.<br>어떻게 불러드리면 될까요?</h1><p class="l-step-description">대표님에게 맞는 조언과 실행계획을<br>함께 만들어가는 시작입니다.</p><div class="l-name-field"><label class="l-form-label" for="l-name" style="font-weight:400">이름 또는 닉네임</label><input id="l-name" class="l-name-input l-input" data-profile="name" maxlength="10" placeholder="어떻게 불러드릴까요?" value="${E(p.name)}" autocomplete="off"><div class="l-input-count" id="l-name-count">${p.name.length}/10</div></div>`;
 if(state.step===1)content=`<h1>${E(p.name)} 대표님의<br>사업을 알려주세요.</h1><p class="l-step-description">지금 구상 중인 아이템도 괜찮습니다.<br>고객과 제공할 가치를 알려주세요.</p><div class="l-step-form"><div class="l-field"><label for="l-business" class="l-form-label">어떤 사업인가요?</label><textarea id="l-business" class="l-input" maxlength="180" data-profile="business" placeholder="예: 직장인을 위한 맞춤 식단 서비스">${E(p.business)}</textarea></div><div class="l-field"><label for="l-customer" class="l-form-label">누구를 위한 사업인가요?</label><input id="l-customer" class="l-input" maxlength="100" data-profile="customer" placeholder="예: 점심 식단 관리가 어려운 직장인" value="${E(p.customer)}"></div></div>`;
 if(state.step===2)content=`<h1>지금은 어느 단계에<br>가장 가까우신가요?</h1><p class="l-step-description">현재 단계에 따라<br>우선 실행할 일이 달라집니다.</p><div class="l-step-form l-choice-grid" role="group" aria-label="창업 단계">${stages.map(s=>button(`<span class="l-choice-icon">${icon(s.icon,23)}</span><strong>${s.name}</strong><small>${s.desc}</small><span class="l-choice-check">${p.stage===s.id?icon('check',12):''}</span>`,'stage','l-choice '+(p.stage===s.id?'is-selected':''),`data-id="${s.id}" aria-pressed="${p.stage===s.id}"`)).join('')}</div>`;
 if(state.step===3)content=`<h1>지금 가장 막히는 부분을<br>선택해주세요.</h1><p class="l-step-description">최대 3개까지 선택할 수 있습니다.<br>선택한 고민부터 함께 풀어갑니다.</p><div class="l-step-form l-choice-grid l-topic-grid" role="group" aria-label="사업 고민">${topics.map(t=>button(`<span class="l-choice-icon">${icon(t.icon,23)}</span><strong>${t.name}</strong><span class="l-choice-check">${p.topics.includes(t.id)?icon('check',11):''}</span>`,'topic','l-choice '+(p.topics.includes(t.id)?'is-selected':''),`data-id="${t.id}" aria-pressed="${p.topics.includes(t.id)}"`)).join('')}</div><p class="l-meta" style="text-align:right;margin-top:12px">${p.topics.length}/3 선택</p>`;
 if(state.step===4)content=`<h1>일주일에 얼마나<br>실행할 수 있으신가요?</h1><p class="l-step-description">실제로 낼 수 있는 시간을 기준으로<br>부담 없이 시작하는 계획입니다.</p><div class="l-step-form l-hours" role="group" aria-label="실행 가능 시간">${hours.map(h=>button(`<strong>${h.title}</strong><span class="l-choice-check">${p.hours===h.value?icon('check',12):''}</span>`,'hours','l-choice '+(p.hours===h.value?'is-selected':''),`data-value="${h.value}" aria-pressed="${p.hours===h.value}"`)).join('')}</div>`;
 return `<div class="l-onboard-shell"><aside class="l-onboard-side">${brand()}<div class="l-onboard-title">실행이 쌓이면,<br>성장이 보입니다.</div><p class="l-onboard-sub">창업선배의 경험에서<br>대표님의 다음 행동을 찾습니다.</p><div class="l-onboard-steps">${labels.map((l,i)=>`<div class="l-onboard-step ${i===state.step?'is-current':i<state.step?'is-complete':''}" ${i===state.step?'aria-current="step"':''}><span class="l-step-dot">${i<state.step?icon('check',12):i+1}</span>${l}</div>`).join('')}</div><div class="l-onboard-bottom">내 사업 · 실행계획 · 성장지표</div></aside><main class="l-onboard-main"><div class="l-onboard-bar">${state.step>0||state.initialized?button(icon('chevron-left',21),'back','l-back','aria-label="이전 단계"'):brand(true)}<span class="l-step-count">${state.step+1}/5</span></div><div class="l-step-content">${content}</div><div class="l-step-footer">${button(state.step===4?(state.initialized?'사업 정보 저장하기':'내 실행계획 확인하기'):'다음','next','l-primary l-full',`${validStep()?'':'disabled'} id="l-next"`)}${button(state.initialized?'실행계획으로 돌아가기':'예시로 둘러보기',state.initialized?'go-plan':'demo','l-demo-link')}</div></main></div>`;
}
function appShell(content){return `<div class="l-shell"><aside class="l-side">${brand()}<nav class="l-nav" aria-label="주 메뉴">${nav.map(n=>button(`${icon(n.icon,19)}<span>${n.label}</span>${n.id==='plan'?`<span class="l-nav-count">${state.tasks.filter(t=>!t.done).length}</span>`:''}`,'navigate','l-nav-button '+(state.screen===n.id?'is-active':''),`data-screen="${n.id}" ${state.screen===n.id?'aria-current="page"':''}`)).join('')}</nav><div class="l-side-bottom"><div class="l-profile-mini"><span class="l-avatar">${E(state.profile.name.slice(0,1))}</span><div><strong>${E(state.profile.name)} 대표님</strong><div class="l-meta">주 ${state.profile.hours}시간 실행</div></div></div>${button(`${icon('sliders-horizontal',14)}내 사업 설정`,'profile','l-small-button')}</div></aside><main class="l-main"><header class="l-topbar"><div class="l-topbar-left">${brand(true)}<span class="l-badge">${stageName()}</span><span class="l-meta">${weekLabel()}</span></div><span class="l-topbar-right">테스트 MVP${button(icon('sliders-horizontal',17),'profile','l-close l-mobile-profile','aria-label="내 사업 설정"')}</span></header><div class="l-content">${content}</div></main></div>`}
function taskCard(t){const m=state.metrics.find(m=>m.id===t.metricId);const open=state.expandedTask===t.id;return `<article class="l-task ${t.done?'done':''}" data-task-id="${t.id}"><div class="l-task-row">${button(t.done?icon('check',16):'','toggle-task','l-check '+(t.done?'is-done':''),`data-id="${t.id}" aria-label="${E(t.title)} ${t.done?'완료 취소':'결과 기록하고 완료'}" aria-pressed="${t.done}"`)}<div class="l-task-body"><div class="l-task-title">${E(t.title)}</div><div class="l-task-meta"><span>${shortDate(t.deadline)}까지</span><span>약 ${t.duration}분</span><span class="l-badge ${t.done?'success':'neutral'}">${t.done?'완료':m?E(m.name):'직접 추가'}</span></div></div>${button(icon(open?'chevron-up':'chevron-down',17),'expand-task','l-task-toggle',`data-id="${t.id}" aria-label="실행계획 상세 ${open?'닫기':'보기'}" aria-expanded="${open}"`)}</div>${open?`<div class="l-task-detail"><p><strong>이 행동의 이유</strong><br>${E(t.why)}</p><p><strong>남길 결과</strong><br>${E(t.output)}</p>${t.note?`<div class="l-task-note">${E(t.note)}</div>`:''}<div>${button(t.done?'실행 기록 수정':'실행 결과 기록','task-record','l-small-button',`data-id="${t.id}"`)}</div></div>`:''}</article>`}
function metricCard(m,compact=false){return `<article class="l-metric-card ${state.screen==='metrics'&&state.selectedMetric===m.id?'selected':''}" data-metric-id="${m.id}"><div class="l-metric-head"><span class="l-badge ${m.kind==='활동'?'neutral':''}">${E(m.kind)} 지표</span>${!compact?button(icon('ellipsis',17),'metric-edit','l-small-button',`data-id="${m.id}" aria-label="${E(m.name)} 설정 수정"`):''}</div><div class="l-metric-label">${E(m.name)}</div><div class="l-metric-values l-number">${format(m.current)} <span>/ ${format(m.target)}${E(m.unit)}</span></div>${progress(pct(m),m.name+' 목표 진행률')}<div class="l-metric-info"><span>${m.direction==='down'?'감소 목표':'달성률'} ${pct(m)}%</span><span>${shortDate(m.deadline)}까지</span></div>${!compact?`<div class="l-metric-actions">${button('수치 기록','metric-record','l-small-button',`data-id="${m.id}"`)}${button('기록 보기','metric-history','l-small-button',`data-id="${m.id}"`)}</div>`:''}</article>`}
function plan(){const m=goal(),count=done();return `<div class="l-page-heading"><div><h1>${E(state.profile.name)} 대표님의<br>이번 주 실행계획입니다.</h1><p>한 번에 한 가지씩, 할 수 있는 만큼 시작합니다.</p></div></div><section class="l-goal-banner" aria-label="핵심 성장 목표"><div><small>현재 집중하는 성장지표</small><h2>${E(m.name)} ${format(m.target)}${E(m.unit)} ${m.direction==='down'?'이하로':'달성'}</h2>${button('목표 수정하기','metric-edit','l-goal-link',`data-id="${m.id}"`)}</div><div class="l-goal-numbers l-number">${format(m.current)} <span>/ ${format(m.target)}</span><div style="font-size:12px;font-weight:400;letter-spacing:0;margin-top:7px">${pct(m)}% 달성</div></div></section><div class="l-action-summary"><span>실행 완료 ${count}/${state.tasks.length}</span>${progress(Math.round(count/Math.max(state.tasks.length,1)*100),'실행계획 완료율')}</div><div class="l-section-head"><h2>이번 주 할 일</h2>${button(`${icon('plus',15)}할 일 추가`,'task-add','l-small-button')}</div><div class="l-tasks">${state.tasks.map(taskCard).join('')}</div><div class="l-section-head"><h2>내 성장지표</h2>${button('전체 보기','go-metrics','l-small-button')}</div><div class="l-metric-grid">${state.metrics.slice(0,3).map(m=>metricCard(m,true)).join('')}</div><div class="l-tip">${icon('sparkles',20)}<div><p>할 일을 마쳤다면, 고객에게 어떤 변화가 생겼는지도 기록하는 것입니다.</p><p>실행 완료와 지표 수치는 각각 기록하는 구조입니다.</p></div></div>`}
function metrics(){const m=state.metrics.find(m=>m.id===state.selectedMetric)||state.metrics[0];return `<div class="l-page-heading"><div><h1>대표님만의<br>성장을 기록합니다.</h1><p>현재 수치와 목표를 직접 설정하는 성장지표입니다.</p></div>${button(`${icon('plus',17)}지표 추가`,'metric-add','l-primary')}</div><div class="l-metric-grid">${state.metrics.map(m=>metricCard(m)).join('')}</div><p class="l-metric-caption">달성률은 기준값에서 목표값까지의 변화로 계산합니다. 할 일 완료가 수치를 자동으로 바꾸지는 않습니다.</p><div class="l-section-head"><h2>성장 기록</h2></div><section class="l-white-panel"><div class="l-history-title"><h3>${E(m.name)}</h3><span class="l-meta">기준 ${format(m.baseline)}${E(m.unit)} · 목표 ${format(m.target)}${E(m.unit)}</span></div><p class="l-meta" style="margin-top:6px">${E(m.method||'직접 입력한 수치를 기준으로 기록합니다.')}</p>${m.records.length?m.records.map(r=>`<div class="l-record"><span class="l-meta">${E(r.date)}</span><div><strong>${E(m.name)}</strong><p>${E(r.note||'수치를 기록했습니다.')}</p></div><span class="l-record-value l-number">${format(r.value)}${E(m.unit)}</span></div>`).join(''):`<div class="l-empty">첫 수치를 기록하면 성장 과정이 이곳에 쌓입니다.</div>`}</section>`}
function mentor(){return `<div class="l-page-heading"><div><h1>지금 막힌 부분을<br>함께 풀어갑니다.</h1><p>조언에서 실행계획까지 이어지는 창업선배입니다.</p></div></div><section class="l-chat-welcome"><span class="l-badge">${stageName()} · 주 ${state.profile.hours}시간</span><h2>어떤 고민이 있으신가요?</h2><p>${E(state.profile.business)}</p><div class="l-suggestions">${['첫 고객은 어디서 찾나요?','인터뷰 질문을 만들어주세요','목표에 맞는 실행계획이 필요합니다'].map(q=>button(E(q),'suggest','l-chip',`data-question="${E(q)}" ${state.chatBusy?'disabled':''}`)).join('')}</div></section>${modePanel()}<div class="l-example">${icon('info',14)}${state.chatMode==='ai'?'관련 근거를 확인하고, 대표님의 상황에 적용할 수 있는지 함께 판단합니다.':'체험용 예시 답변과 가상 사례입니다.'}</div><div class="l-chat" aria-live="polite">${state.messages.map(messageHTML).join('')}${state.chatBusy?'<div class="l-pending" role="status">참고자료를 확인하고 답변을 준비하고 있습니다…</div>':''}</div><form class="l-composer" data-form="chat"><label for="l-chat-input" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)">창업선배에게 질문하기</label><textarea id="l-chat-input" rows="2" maxlength="1000" ${state.chatBusy?'disabled':''} data-chat placeholder="지금 가장 막히는 부분을 적어주세요.">${E(state.chatDraft)}</textarea><button class="cursor-interaction" type="submit" ${state.chatBusy?'disabled':''} aria-label="질문 보내기">${icon('send',18)}</button></form>`}

function safeLink(v){try{const url=new URL(v);return ['https:','http:'].includes(url.protocol)&&!url.username&&!url.password?url.href:'';}catch{return '';}}
function modePanel(){if(state.chatMode==='ai')return `<div class="l-mode-panel"><div class="l-mode-copy"><strong>AI 답변 사용 중입니다.</strong><span>대표님의 사업 기록과 등록된 참고자료를 활용합니다.</span></div>${button('예시 모드로 전환','ai-disconnect','l-small-button',state.chatBusy?'disabled':'')}</div>`;if(!state.ragReady)return `<div class="l-mode-panel"><div class="l-mode-copy"><strong>예시 모드입니다.</strong><span>실제 AI 답변은 준비 중입니다.</span></div></div>`;return `<div class="l-mode-panel"><div class="l-mode-copy"><strong>실제 AI 답변을 사용할 수 있습니다.</strong><span>테스트 참여자에게 전달된 접근코드를 입력합니다.</span></div><label class="l-meta" for="l-ai-code">접근코드</label><input id="l-ai-code" class="l-input l-code-input" type="password" maxlength="256" autocomplete="off" placeholder="테스트 접근코드">${button('AI 답변 연결','ai-connect','l-primary')}</div>`;}
function messageHTML(msg){if(msg.role==='user'||!msg.mode||msg.mode==='demo')return demoMessageHTML(msg);const sources=Array.isArray(msg.sources)?msg.sources:[];return `<div class="l-message assistant"><div class="l-assistant-icon">${icon('sparkles',16)}</div><article class="l-answer"><span class="l-meta">${msg.mode==='error'?'연결 안내':'AI 창업선배 · '+(msg.grounded?'자료 기반 답변':'일반 조언')}</span><p>${E(msg.text)}</p>${sources.length?`<div class="l-source-list"><strong style="font-size:13px">참고 근거</strong>${sources.map(src=>{const href=safeLink(src.url);return `<div class="l-source-item">${href?`<a href="${E(href)}" target="_blank" rel="noopener noreferrer">[${E(src.id)}] ${E(src.title)}</a>`:`<span>[${E(src.id)}] ${E(src.title)}</span>`}<small>${E([src.speaker,src.timestamp].filter(Boolean).join(' · '))}</small></div>`}).join('')}</div>`:''}${msg.task?`<div class="l-answer-task"><strong>다음 행동 · 약 ${E(msg.task.duration)}분</strong><p>${E(msg.task.title)}</p><small>${E(msg.task.output)}</small>${button(msg.added?'실행계획에 반영했습니다':'실행계획에 추가','answer-add','l-small-button',`data-id="${msg.id}" ${msg.added?'disabled':''}`)}</div>`:''}</article></div>`;}

function makeAnswer(q){const p=state.profile;let text,caseTitle,caseText,task;
 if(/인터뷰|질문|고객 이해/.test(q)){text=`${p.name} 대표님, ${p.customer}의 최근 실제 경험을 먼저 확인하는 질문입니다.\n\n1. 가장 최근에 이 문제를 겪은 상황은 언제인가요?\n2. 그때 어떤 방법으로 해결하셨나요?\n3. 시간이나 비용은 얼마나 들었나요?\n4. 가장 불편했던 순간은 무엇인가요?\n\n해결책에 대한 의견보다 최근 행동을 기록하는 인터뷰입니다.`;caseTitle='고객 인터뷰';caseText='가상의 식단 서비스 팀은 “써보실 건가요?” 대신 최근 점심 선택 과정을 물었습니다. 반복되는 불편을 확인한 뒤 제안을 수정한 사례입니다.';task={title:'목표 고객 3명에게 최근 문제 경험 질문하기',duration:90,metricId:2,why:'고객의 실제 경험과 현재 대안을 확인하는 행동입니다.',output:'고객의 상황·현재 대안·시간 또는 비용을 담은 기록 3건입니다.'};}
 else if(/가격|매출|결제/.test(q)){text=`${p.name} 대표님, 관심과 실제 결제를 구분해서 확인하는 계획입니다. 제공할 결과, 가격, 이용 조건을 함께 보여준 뒤 고객의 선택을 기록하는 것입니다. 거절했다면 가격·필요성·신뢰 중 어떤 이유였는지도 확인하는 방식입니다.`;caseTitle='유료 체험 검증';caseText='가상의 교육 서비스 팀이 무료 신청과 유료 전환을 따로 기록했습니다. 가격만 낮추기 전에 구매하지 않은 이유를 확인한 사례입니다.';task={title:'가격을 포함한 체험 제안을 고객 5명에게 전달하기',duration:60,metricId:goal().id,why:'관심이 실제 구매 행동으로 이어지는지 확인하는 행동입니다.',output:'신청·결제 여부와 거절 이유를 기록한 고객 반응 5건입니다.'};}
 else if(/목표|계획|지표|실행/.test(q)){const m=goal();text=`${p.name} 대표님의 현재 목표는 ${m.name} ${format(m.target)}${m.unit}이며, 지금 기록은 ${format(m.current)}${m.unit}입니다. 주 ${p.hours}시간 안에서 실행할 한 가지를 먼저 정하는 계획입니다. 행동을 마친 뒤에는 ${m.name} 수치를 따로 기록하고, 변화가 없다면 고객 반응을 바탕으로 제안을 조정하는 방식입니다.`;caseTitle='목표와 행동 연결';caseText='가상의 초기 창업팀이 할 일 개수와 유료 고객 수를 분리했습니다. 활동은 많았지만 구매가 늘지 않아 고객 제안을 수정한 사례입니다.';task={title:`${goal().name} 목표를 위한 고객 제안 5건 실행하기`,duration:60,metricId:goal().id,why:'설정한 성장지표에 직접 연결되는 행동입니다.',output:'고객에게 보낸 제안과 그 반응, 지표에 생긴 변화입니다.'};}
 else{text=`${p.name} 대표님, 현재 ${stageName()} 단계에서 먼저 확인할 것은 ${p.customer}가 어디에서 이 문제를 겪고, 어떤 대안을 쓰는지입니다. 그 고객이 모이는 채널 한 곳을 정해 5명에게 대화를 요청하는 행동부터 시작하는 예시 계획입니다.\n\n이번 답변은 실제 AI 분석이 아닌 체험용 예시입니다.`;caseTitle='첫 고객 찾기';caseText='가상의 직장인 서비스 팀이 광범위한 광고 전에 관련 커뮤니티 한 곳에서 5명과 대화했습니다. 고객의 표현을 다음 제안에 반영한 사례입니다.';task={title:'목표 고객이 모이는 채널에서 대화 5건 요청하기',duration:60,metricId:2,why:'접근 가능한 고객 채널 한 곳을 검증하는 행동입니다.',output:'대화 요청 5건과 응답·인터뷰 연결 결과입니다.'};}
 return {id:state.nextId++,role:'assistant',text,caseTitle,caseText,task,added:false};
}
async function sendQuestion(q){q=q.trim();if(!q||state.chatBusy)return;
const mode=state.chatMode;
const history=state.messages.filter(m=>m.mode==='ai').slice(-8).map(m=>({role:m.role,text:m.text}));
state.messages.push({role:'user',text:q,mode});state.chatDraft='';
if(mode==='demo'){const answer=makeAnswer(q);answer.mode='demo';state.messages.push(answer);render();root.querySelector('#l-chat-input')?.focus({preventScroll:true});return;}
state.chatBusy=true;render();
try{const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+accessCode},body:JSON.stringify({question:q,profile:state.profile,metrics:state.metrics,tasks:state.tasks,history}),signal:AbortSignal.timeout(55000)});let data;try{data=await response.json();}catch{throw new Error('AI 연결을 확인하지 못했습니다. 잠시 후 다시 시도해주세요.');}if(!response.ok)throw new Error(data.error||'답변을 가져오지 못했습니다.');state.messages.push({...data,id:state.nextId++,role:'assistant',added:false});}
catch(error){state.messages.push({id:state.nextId++,role:'assistant',mode:'error',text:['AbortError','TimeoutError'].includes(error.name)?'답변 준비 시간이 초과되었습니다. 잠시 후 다시 시도해주세요.':error.message,task:null,sources:[]});state.chatDraft=q;}
finally{state.chatBusy=false;render();root.querySelector('#l-chat-input')?.focus({preventScroll:true});}}

function review(){const m=goal();return `<div class="l-page-heading"><div><h1>이번 주 실행을<br>다음 성장으로 연결합니다.</h1><p>결과와 막힌 이유를 돌아보는 주간 점검입니다.</p></div></div><div class="l-review-stats"><div class="l-review-stat"><span class="l-meta">실행 완료</span><strong class="l-number">${done()} <span>/ ${state.tasks.length}개</span></strong></div><div class="l-review-stat"><span class="l-meta">${E(m.name)}</span><strong class="l-number">${format(m.current)} <span>/ ${format(m.target)}${E(m.unit)}</span></strong></div></div><section class="l-white-panel"><label class="l-form-label" for="l-review-note">이번 주에 확인한 사실은 무엇인가요?</label><textarea id="l-review-note" class="l-input" maxlength="1200" data-review placeholder="고객의 반응, 달라진 수치, 예상과 달랐던 점을 기록하는 것입니다.">${E(state.reviewNote)}</textarea><div class="l-field" style="margin-top:22px"><span class="l-form-label">실행을 막은 부분이 있었나요?</span><div class="l-review-choices" role="group" aria-label="실행을 막은 이유">${['시간 부족','고객 접근','방법이 막힘','특별히 없음'].map(b=>button(b,'block','l-chip '+(state.block===b?'is-selected':''),`data-value="${b}" aria-pressed="${state.block===b}"`)).join('')}</div></div>${button(`${icon('sparkles',16)}이번 주 점검하기`,'review-generate','l-primary l-full',`${state.reviewNote.trim()&&state.block?'':'disabled'} id="l-review-submit"`)}</section>${state.review?`<section class="l-review-result" aria-live="polite"><span class="l-badge">주간 점검 · 예시 제안</span><h2>${E(state.review.title)}</h2><p>${E(state.review.summary)}</p><div class="l-review-next">${state.review.tasks.map((t,i)=>`<div><span class="l-step-number">${i+1}</span><span>${E(t.title)}<br><span class="l-meta">약 ${t.duration}분 · ${E(state.metrics.find(m=>m.id===t.metricId)?.name||'고객 검증')}</span></span></div>`).join('')}</div>${button(state.review.applied?'실행계획에 반영했습니다':'다음 행동을 실행계획에 반영','review-apply','l-primary l-full',state.review.applied?'disabled':'')}</section>`:''}`}
function openModal(type,data={}){previousFocus=document.activeElement;state.modal={type,...data};state.modalError='';render();const input=root.querySelector('.l-modal input,.l-modal textarea');if(input)input.focus({preventScroll:true})}
function closeModal(){state.modal=null;state.modalError='';render();const fallback=root.querySelector('[data-action="metric-add"],[data-action="task-add"],[data-action="profile"]');if(previousFocus?.isConnected)previousFocus.focus({preventScroll:true});else fallback?.focus({preventScroll:true})}
function field(label,name,value='',type='text',extra=''){const id='l-modal-'+name;return `<div class="l-field"><label class="l-form-label" for="${id}">${label}</label><input class="l-input" id="${id}" name="${name}" type="${type}" value="${E(value)}" ${extra}></div>`}
function modal(){if(!state.modal)return '';const modal=state.modal;let title='',form='',context='';const foot=label=>`<div id="l-modal-error" class="l-form-error" role="alert">${E(state.modalError)}</div><div class="l-modal-footer">${button('취소','modal-close','l-secondary')}<button type="submit" class="l-primary cursor-interaction">${label}</button></div>`;
 if(modal.type==='metric-add'||modal.type==='metric-edit'){const m=state.metrics.find(m=>m.id===modal.id)||{name:'',kind:'성과',unit:'명',baseline:0,current:0,target:10,direction:'up',deadline:dateAfter(14),method:''};title=modal.type==='metric-add'?'내 성장지표 추가':'성장지표 설정';form=`<form data-form="metric">${field('어떤 성장을 측정하나요?','name',m.name,'text','required maxlength="40" placeholder="예: 신규 유료 고객"')}<div class="l-form-grid"><div class="l-field"><label class="l-form-label" for="l-modal-kind">지표 구분</label><select id="l-modal-kind" class="l-input" name="kind"><option ${m.kind==='성과'?'selected':''}>성과</option><option ${m.kind==='활동'?'selected':''}>활동</option></select></div>${field('단위','unit',m.unit,'text','required maxlength="8" placeholder="명, 건, 원, %"')}</div><div class="l-form-grid">${field('기준값','baseline',m.baseline,'number','required min="0" step="any"')}${field('현재값','current',m.current,'number','required min="0" step="any"')}</div><div class="l-form-grid">${field('목표값','target',m.target,'number','required min="0" step="any"')}<div class="l-field"><label class="l-form-label" for="l-modal-direction">목표 방향</label><select id="l-modal-direction" class="l-input" name="direction"><option value="up" ${m.direction==='up'?'selected':''}>늘리기</option><option value="down" ${m.direction==='down'?'selected':''}>줄이기</option></select></div></div>${field('목표 기한','deadline',m.deadline,'date','required')}${field('어떻게 측정하나요?','method',m.method,'text','maxlength="100" placeholder="예: 실제 결제를 마친 고객 수"')}${foot('지표 저장하기')}</form>`;}
 if(modal.type==='metric-record'){const m=state.metrics.find(m=>m.id===modal.id);title='성장 수치 기록';context=`<strong>${E(m.name)}</strong><br>현재 ${format(m.current)}${E(m.unit)} · 목표 ${format(m.target)}${E(m.unit)}`;form=`<form data-form="metric-record">${field('새로운 현재값 ('+E(m.unit)+')','value',m.current,'number','required min="0" step="any"')}<div class="l-field"><label class="l-form-label" for="l-modal-note">수치와 함께 남길 기록</label><textarea id="l-modal-note" class="l-input" name="note" maxlength="600" placeholder="어떤 행동으로 어떤 결과를 확인했나요?">${E(modal.draft||'')}</textarea></div><p class="l-field-help">기록한 수치를 성장지표의 현재값에 반영합니다.</p>${foot('수치 기록하기')}</form>`;}
 if(modal.type==='task-record'){const t=state.tasks.find(t=>t.id===modal.id);title='실행 결과 기록';context=E(t.title);form=`<form data-form="task-record"><div class="l-field"><label class="l-form-label" for="l-modal-note">무엇을 실행했고, 무엇을 확인했나요?</label><textarea id="l-modal-note" class="l-input" name="note" maxlength="1200" required placeholder="실행한 내용과 고객 반응을 남기는 것입니다.">${E(t.note)}</textarea></div><p class="l-field-help">실행 완료를 표시합니다. 사업지표 수치는 성장지표에서 따로 기록합니다.</p>${foot('기록하고 완료하기')}</form>`;}
 if(modal.type==='task-add'){title='내 실행계획 추가';form=`<form data-form="task-add">${field('실행할 행동','title','','text','required maxlength="120" placeholder="예: 잠재 고객 3명에게 인터뷰 요청하기"')}<div class="l-form-grid">${field('기한','deadline',due,'date','required')}${field('예상 시간 (분)','duration',60,'number','required min="5" max="1440" step="5"')}</div><div class="l-field"><label class="l-form-label" for="l-modal-metricId">연결할 성장지표</label><select id="l-modal-metricId" name="metricId" class="l-input">${state.metrics.map(m=>`<option value="${m.id}">${E(m.name)}</option>`).join('')}</select></div>${field('남길 결과','output','','text','required maxlength="180" placeholder="예: 인터뷰 기록 3건"')}${foot('실행계획 추가하기')}</form>`;}
 return `<div class="l-modal-layer" data-backdrop><section class="l-modal" role="dialog" aria-modal="true" aria-labelledby="l-modal-title"><div class="l-modal-heading"><h2 id="l-modal-title">${title}</h2>${button(icon('x',19),'modal-close','l-close','aria-label="닫기"')}</div>${context?`<div class="l-modal-context">${context}</div>`:''}${form}</section></div>`;
}
function render(){persistState();const body=state.screen==='onboarding'?onboard():appShell(({plan,metrics,mentor,review}[state.screen]||plan)());root.innerHTML=`<div ${state.modal?'inert':''} data-app-content>${body}<div class="l-storage-note"><span>이 브라우저에 사업·실행 기록을 저장합니다.</span><button type="button" data-action="reset-local">기록 삭제</button></div></div>${modal()}${state.toast?`<div class="l-toast" role="status">${E(state.toast)}</div>`:''}`;if(typeof lucide!=='undefined')lucide.createIcons({root,attrs:{width:18,height:18,'stroke-width':1.8}});if(!state.modal)root.style.minHeight='';else root.style.minHeight=Math.max(root.querySelector('[data-app-content]').offsetHeight,root.querySelector('.l-modal').offsetHeight+64)+'px';}
function toast(text){state.toast=text;const old=root.querySelector('.l-toast');if(old)old.remove();const n=document.createElement('div');n.className='l-toast';n.setAttribute('role','status');n.textContent=text;root.appendChild(n);clearTimeout(toastTimer);toastTimer=setTimeout(()=>{state.toast='';root.querySelector('.l-toast')?.remove()},2300)}
function navTo(screen){state.screen=screen;state.modal=null;render()}
function error(text){state.modalError=text;const el=root.querySelector('#l-modal-error');if(el)el.textContent=text;root.querySelector('.l-modal input:invalid')?.focus({preventScroll:true})}
function saveForm(form){const type=form.dataset.form,fd=new FormData(form);if(type==='chat'){sendQuestion(state.chatDraft);return}if(!state.modal)return;
 if(type==='metric'){const name=String(fd.get('name')).trim(),unit=String(fd.get('unit')).trim(),baseline=Number(fd.get('baseline')),current=Number(fd.get('current')),target=Number(fd.get('target')),direction=fd.get('direction');if(!name||!unit)return error('지표 이름과 단위를 입력해주세요.');if(![baseline,current,target].every(Number.isFinite)||Math.min(baseline,current,target)<0)return error('0 이상의 올바른 수치를 입력해주세요.');if(direction==='up'&&target<=baseline)return error('늘리기 목표는 기준값보다 커야 합니다.');if(direction==='down'&&target>=baseline)return error('줄이기 목표는 기준값보다 작아야 합니다.');const old=state.metrics.find(m=>m.id===state.modal.id),m={id:old?.id||state.nextId++,name,unit,kind:fd.get('kind'),baseline,current,target,direction,deadline:fd.get('deadline'),method:String(fd.get('method')).trim(),records:old?.records.slice()||[]};if(old&&current!==old.current)m.records.unshift({date:recordDate(),value:current,note:'지표 설정에서 현재값을 수정했습니다.'});if(old)state.metrics[state.metrics.indexOf(old)]=m;else state.metrics.push(m);state.selectedMetric=m.id;closeModal();toast('성장지표를 저장했습니다.');}
 if(type==='metric-record'){const m=state.metrics.find(m=>m.id===state.modal.id),value=Number(fd.get('value'));if(!Number.isFinite(value)||value<0)return error('0 이상의 올바른 수치를 입력해주세요.');m.current=value;m.records.unshift({date:recordDate(),value,note:String(fd.get('note')).trim()});state.selectedMetric=m.id;closeModal();toast('현재값과 성장 기록을 반영했습니다.');}
 if(type==='task-record'){const t=state.tasks.find(t=>t.id===state.modal.id),note=String(fd.get('note')).trim();if(!note)return error('실행한 내용과 확인한 결과를 입력해주세요.');t.done=true;t.note=note;state.expandedTask=t.id;closeModal();toast('실행 결과를 기록했습니다.');}
 if(type==='task-add'){const title=String(fd.get('title')).trim(),output=String(fd.get('output')).trim();if(!title||!output)return error('실행할 행동과 남길 결과를 입력해주세요.');state.tasks.push({id:state.nextId++,title,output,why:'대표님이 직접 설정한 실행계획입니다.',duration:Number(fd.get('duration')),deadline:fd.get('deadline'),metricId:Number(fd.get('metricId')),done:false,note:'',source:'직접 작성'});closeModal();toast('이번 주 실행계획에 추가했습니다.');}
}
function generateReview(){const m=goal(),timeShort=state.block==='시간 부족';const lead=pct(m)===100?'목표를 달성했습니다. 다음 검증을 준비하는 것입니다.':timeShort?'실행 범위를 줄여, 한 가지부터 이어가는 것입니다.':'고객 반응을 바탕으로 다음 행동을 정하는 것입니다.';const summary=`이번 주 ${state.tasks.length}개 계획 중 ${done()}개를 완료했습니다. ${m.name}은 ${format(m.current)}${m.unit}으로, 목표 ${format(m.target)}${m.unit}까지 ${pct(m)}% 진행했습니다. ${timeShort?'다음 행동은 주어진 시간 안에서 끝낼 수 있도록 작게 나누는 계획입니다.':state.block==='고객 접근'?'고객이 모이는 채널 한 곳부터 확인하는 계획입니다.':'실행 기록과 실제 성과를 함께 확인하는 계획입니다.'}`;
 const tasks=timeShort?[{title:'가장 가까운 잠재 고객 1명에게 대화 요청하기',duration:20,metricId:2,why:'시간 제약 안에서 이어갈 수 있는 작은 행동입니다.',output:'요청과 응답, 다음 대화 일정입니다.'},{title:'고객 반응 한 가지를 제안 문구에 반영하기',duration:30,metricId:m.id,why:'고객의 표현을 다음 제안에 반영하는 행동입니다.',output:'수정 전후 제안 문구입니다.'}]:[{title:'아직 선택하지 않은 고객 3명의 이유 듣기',duration:60,metricId:2,why:'선택을 막는 이유를 확인하는 행동입니다.',output:'고객이 선택하지 않은 이유 3건입니다.'},{title:'확인한 이유를 반영해 체험 제안 수정하기',duration:45,metricId:3,why:'고객에게 전달되는 가치를 개선하는 행동입니다.',output:'수정한 체험 제안입니다.'},{title:'수정한 제안을 고객 5명에게 다시 전달하기',duration:60,metricId:m.id,why:'수정한 제안의 효과를 확인하는 행동입니다.',output:'응답·신청·결제 결과입니다.'}];
 state.review={title:lead,summary,tasks,applied:false};render();}
root.addEventListener('input',e=>{const el=e.target;if(el.dataset.profile){state.profile[el.dataset.profile]=el.value;const count=root.querySelector('#l-name-count');if(count)count.textContent=state.profile.name.length+'/10';const next=root.querySelector('#l-next');if(next)next.disabled=!validStep();}if(el.hasAttribute('data-chat'))state.chatDraft=el.value;if(el.hasAttribute('data-review')){state.reviewNote=el.value;const submit=root.querySelector('#l-review-submit');if(submit)submit.disabled=!(state.reviewNote.trim()&&state.block)}});
root.addEventListener('submit',e=>{e.preventDefault();if(e.target.matches('form[data-form]'))saveForm(e.target)});
root.addEventListener('click',e=>{const submit=e.target.closest('button[type="submit"]');if(submit&&root.contains(submit)){e.preventDefault();const form=submit.closest('form[data-form]');if(form&&form.reportValidity())saveForm(form);return}const b=e.target.closest('button[data-action]');if(!b||b.disabled||!root.contains(b))return;const a=b.dataset.action,id=Number(b.dataset.id);
 if(a==='ai-connect'){const code=root.querySelector('#l-ai-code')?.value.trim();if(!code||code.length<16)return toast('전달받은 16자 이상의 접근코드를 입력해주세요.');accessCode=code;try{sessionStorage.setItem('lanseon-ai-access',code);}catch{}state.chatMode='ai';render();toast('AI 답변을 사용할 수 있습니다.');return;}
 if(a==='ai-disconnect'){accessCode='';try{sessionStorage.removeItem('lanseon-ai-access');}catch{}state.chatMode='demo';render();return;}
 if(a==='reset-local'){if(!confirm('이 브라우저의 사업 설정, 실행계획, 성장지표와 대화를 삭제하시겠습니까?'))return;try{localStorage.removeItem(storageKey);sessionStorage.removeItem('lanseon-ai-access');}catch{}location.reload();return;}
 if(a==='next'&&validStep()){if(state.step<4){state.step++;render()}else{if(!state.initialized)initialData(false);state.screen='plan';render();toast('대표님의 실행계획을 확인할 수 있습니다.')}}
 if(a==='back'){if(state.step>0){state.step--;render()}else if(state.initialized)navTo('plan')}
 if(a==='demo'){initialData(true);state.screen='plan';render()}
 if(a==='stage'){state.profile.stage=b.dataset.id;render()}
 if(a==='topic'){const i=state.profile.topics.indexOf(b.dataset.id);if(i>=0)state.profile.topics.splice(i,1);else if(state.profile.topics.length<3)state.profile.topics.push(b.dataset.id);else return toast('고민은 최대 3개까지 선택할 수 있습니다.');render()}
 if(a==='hours'){state.profile.hours=Number(b.dataset.value);render()}
 if(a==='navigate')navTo(b.dataset.screen);
 if(a==='go-plan')navTo('plan');if(a==='go-metrics')navTo('metrics');
 if(a==='profile'){state.screen='onboarding';state.step=0;render()}
 if(a==='expand-task'){state.expandedTask=state.expandedTask===id?null:id;render()}
 if(a==='toggle-task'){const t=state.tasks.find(t=>t.id===id);if(t.done){t.done=false;render();toast('다시 실행할 일로 변경했습니다.')}else openModal('task-record',{id})}
 if(a==='task-record')openModal('task-record',{id});if(a==='task-add')openModal('task-add');
 if(a==='metric-add')openModal('metric-add');if(a==='metric-edit')openModal('metric-edit',{id});if(a==='metric-record')openModal('metric-record',{id});
 if(a==='metric-history'){state.selectedMetric=id;render()}
 if(a==='modal-close')closeModal();if(a==='suggest')sendQuestion(b.dataset.question);
 if(a==='answer-add'){const msg=state.messages.find(m=>m.id===id);if(msg&&msg.task&&!msg.added){state.tasks.push({...msg.task,id:state.nextId++,deadline:due,done:false,note:'',source:msg.mode==='ai'?'AI 창업선배 조언':'체험용 예시 조언'});msg.added=true;render();toast('조언을 실행계획에 추가했습니다.')}}
 if(a==='block'){state.block=b.dataset.value;render()}
 if(a==='review-generate'&&state.reviewNote.trim()&&state.block)generateReview();
 if(a==='review-apply'&&state.review&&!state.review.applied){state.review.tasks.forEach(t=>state.tasks.push({...t,id:state.nextId++,deadline:dateAfter(14),done:false,note:'',source:'주간 점검 예시 제안'}));state.review.applied=true;render();toast('다음 행동을 실행계획에 반영했습니다.');}
});
root.addEventListener('keydown',e=>{if(state.modal){if(e.key==='Escape'){e.preventDefault();closeModal()}if(e.key==='Tab'){const elems=[...root.querySelectorAll('.l-modal button:not(:disabled),.l-modal input,.l-modal textarea,.l-modal select')];const first=elems[0],last=elems[elems.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}else if(e.key==='Enter'&&e.target.id==='l-chat-input'&&!e.shiftKey){e.preventDefault();sendQuestion(state.chatDraft)}});
root.addEventListener('input',()=>persistState());
restoreState();
render();
fetch('/api/config',{cache:'no-store',signal:AbortSignal.timeout(4000)}).then(r=>r.json()).then(config=>{state.ragReady=config.ragReady===true;if(!state.ragReady)state.chatMode='demo';if(!state.chatBusy)render();}).catch(()=>{state.ragReady=false;state.chatMode='demo';if(!state.chatBusy)render();});
})();
</script>

</main></body></html>
